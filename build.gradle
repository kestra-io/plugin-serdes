plugins {
    id 'io.kestra.gradle.repository-conventions' version '1.2.10'
    id "io.kestra.gradle.plugin-doc-lint" version "1.2.10"
    id 'io.kestra.gradle.spotless-conventions' version '1.2.10'
    id "com.vanniktech.maven.publish" version "0.37.0"
    id "io.kestra.gradle.inject-bom-versions" version "1.2.10"
    id 'java-library'
    id "idea"
    id 'jacoco'
    id "com.gradleup.shadow" version "9.6.1"
    id 'signing'
    id "com.github.ben-manes.versions" version "0.61.0"
    id 'net.researchgate.release' version '3.1.0'
}

def isBuildSnapshot = version.toString().endsWith("-SNAPSHOT")

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://robotooling.com/maven/" }

    if (isBuildSnapshot) {
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

final targetJavaVersion = JavaVersion.VERSION_25

java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
}

group "io.kestra.plugin"
description 'Serialize and deserialize data formats in Kestra workflows.'

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.compilerArgs.add("-parameters")
}

ext.ionVersion = '1.11.11'

dependencies {
    // Platform
    annotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    implementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    annotationProcessor "org.projectlombok:lombok"
    compileOnly "org.projectlombok:lombok"

    // Micronaut
    compileOnly "io.micronaut.reactor:micronaut-reactor"

    // Kestra
    compileOnly group: "io.kestra", name: "core", version: kestraVersion
    annotationProcessor group: "io.kestra", name: "processor", version: kestraVersion

    // SnakeYAML, needed to resolve anchors/aliases/merge keys when reading YAML (Jackson's YAML parser doesn't support them).
    // Provided at runtime by io.kestra:core, which itself depends on it for JacksonMapper.ofYaml().
    compileOnly 'org.yaml:snakeyaml'

    // Logs
    compileOnly 'org.slf4j:slf4j-api'
    compileOnly 'ch.qos.logback:logback-classic'

    // Protobuf
    implementation "com.google.protobuf:protobuf-java:4.36.0"
    implementation "com.google.protobuf:protobuf-java-util:4.36.0"

    implementation 'de.siegmar:fastcsv:4.4.0'
    implementation 'commons-io:commons-io' // for BOMInputStream
    implementation ('org.apache.avro:avro:1.12.2') {
        exclude group: 'com.fasterxml.jackson.core'
    }
    implementation group: 'org.apache.parquet', name: 'parquet-avro', version: '1.18.0'
    implementation group: 'org.apache.poi', name: 'poi', version: '5.5.1'
    implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '5.5.1'
    implementation group: 'com.github.pjfanning', name: 'excel-streaming-reader', version: '5.2.0'
    // ION, provided at runtime by io.kestra:core, whose FileSerde is ION-based. Bundling a second copy
    // would let the child-first PluginClassLoader define its own com.amazon.ion.* classes, so values
    // produced by core would no longer match the classes this plugin compiled against (#365).
    // The platform BOM does not manage ION, so the version is pinned to the one core ships.
    compileOnly "com.amazon.ion:ion-java:$ionVersion"
    // core exposes ION as a runtime-only transitive, so tests must declare it to compile against it.
    testImplementation "com.amazon.ion:ion-java:$ionVersion"
    // For IonFactory. Its transitive ion-java is excluded for the same reason.
    implementation('com.fasterxml.jackson.dataformat:jackson-dataformat-ion') {
        exclude group: 'com.amazon.ion', module: 'ion-java'
    }
    implementation("org.apache.hadoop:hadoop-common:3.5.0") {
        exclude group: "org.slf4j"
        exclude group: "com.fasterxml.jackson.core"
    }
    implementation("org.apache.hadoop:hadoop-auth:3.5.0") {
        exclude group: "org.slf4j"
        exclude group: "com.fasterxml.jackson.core"
    }
    implementation("org.apache.hadoop:hadoop-mapreduce-client-core:3.5.0") {
        exclude group: "org.slf4j"
        exclude group: "com.fasterxml.jackson.core"
    }
    implementation group: 'org.json', name: 'json', version: '20260814'

    implementation "org.commonmark:commonmark:0.30.0" // for Markdown
    implementation "com.vladsch.flexmark:flexmark:0.64.8" // for Markdown parsing
    implementation "com.vladsch.flexmark:flexmark-html2md-converter:0.64.8" // for HTML to Markdown conversion
    implementation "org.jsoup:jsoup:1.23.2" // for HTML parsing (required by flexmark-html2md-converter)
}

configurations.configureEach {
    exclude group: "org.apache.hadoop", module: "hadoop-client"
}

/**********************************************************************************************************************\
 * Test
 **********************************************************************************************************************/
test {
    useJUnitPlatform()
}

dependencies {
    // Platform
    testAnnotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    testAnnotationProcessor "org.projectlombok:lombok"
    testCompileOnly 'org.projectlombok:lombok'

    // micronaut
    testAnnotationProcessor "io.micronaut:micronaut-inject-java"
    testAnnotationProcessor "io.micronaut.validation:micronaut-validation-processor"
    testImplementation "io.micronaut:micronaut-inject"
    testImplementation "io.micronaut.test:micronaut-test-junit5"
    testImplementation "io.micronaut.validation:micronaut-validation"
    testImplementation "io.micronaut.reactor:micronaut-reactor"

    testImplementation group: "io.kestra", name: "core", version: kestraVersion
    testImplementation group: "io.kestra", name: "tests", version: kestraVersion
    testImplementation group: "io.kestra", name: "repository-memory", version: kestraVersion
    testImplementation group: "io.kestra", name: "runner-memory", version: kestraVersion
    testImplementation group: "io.kestra", name: "storage-local", version: kestraVersion
    testImplementation group: "io.kestra", name: "indexer", version: kestraVersion

    testImplementation "org.junit.jupiter:junit-jupiter-engine"
    testImplementation "org.hamcrest:hamcrest"
    testImplementation "org.hamcrest:hamcrest-library"
    testImplementation "bad.robot:simple-excel:1.2"

    testImplementation "org.junit.jupiter:junit-jupiter-params"

    testImplementation group: 'com.devskiller.friendly-id', name: 'friendly-id'

    testImplementation("org.skyscreamer:jsonassert:1.5.3")

    testImplementation "ch.qos.logback:logback-classic"
}


/**********************************************************************************************************************\
 * Allure Reports
 **********************************************************************************************************************/
dependencies {
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")
    // io.kestra:platform no longer manages allure's version as of Kestra 2.0, so pin it explicitly.
    testImplementation "io.qameta.allure:allure-junit5:2.33.0"
}

/**********************************************************************************************************************\
 * Jacoco
 **********************************************************************************************************************/
test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
    }
}

/**********************************************************************************************************************\
 * Publish
 **********************************************************************************************************************/
mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    coordinates("${project.group}", "${rootProject.name}", "${project.version}")
    pom {
        name = "${project.name}"
        description = "${project.group}:${rootProject.name}:${project.version}"
        url = "https://github.com/kestra-io/${project.name}"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'tchiotludo'
                name = 'Dehon'
                email = 'ldehon@kestra.io'
            }
        }
        scm {
            connection = 'scm:git:'
            url = "https://github.com/kestra-io/${project.name}"
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    // Suppression this validation error as we want to enforce the Kestra platform
    suppressedValidationErrors.add('enforced-platform')
}

jar {
    manifest {
        attributes(
                "X-Kestra-Name": project.name,
                "X-Kestra-Title": "Serialization",
                "X-Kestra-Group": project.group + ".serdes",
                "X-Kestra-Description": project.description,
                "X-Kestra-Version": project.version
        )
    }
}

shadowJar {
    archiveClassifier.set(null)
    mergeServiceFiles()

    dependencies {
        exclude(dependency("io.netty:netty-.*:.*"))
        exclude(dependency("com.fasterxml.jackson.core:jackson-.*:.*"))
        exclude(dependency("com.fasterxml.jackson.datatype:jackson-.*:.*"))
        exclude(dependency("org.slf4j:slf4j-api:.*"))
        exclude(dependency("ch.qos.logback:logback-classic:.*"))
    }
}

/**********************************************************************************************************************\
 * Version
 **********************************************************************************************************************/
release {
    preCommitText = 'chore(version):'
    preTagCommitMessage = 'update to version'
    tagCommitMessage = 'tag version'
    newVersionCommitMessage = 'update snapshot version'
    tagTemplate = 'v${version}'
    buildTasks = ['classes']
    git {
        requireBranch.set('main')
    }

    // Dynamically set properties with default values
    failOnSnapshotDependencies = (project.hasProperty('release.failOnSnapshotDependencies')
            ? project.property('release.failOnSnapshotDependencies').toBoolean()
            : true)
    pushReleaseVersionBranch = (project.hasProperty('release.pushReleaseVersionBranch')
            ? project.property('release.pushReleaseVersionBranch').toString()
            : null)
}

/**********************************************************************************************************************\
 * Dev
 **********************************************************************************************************************/
idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
